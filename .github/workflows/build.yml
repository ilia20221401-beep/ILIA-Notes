name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-release:
    name: Build ILIA Notes Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Platform 36 & Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "Installing Android SDK Platform 36 and Build-Tools..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradlew is Executable
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Prepare Keystore and Signing Environment
        run: |
          # Create .env file so Secrets plugin does not fail
          touch .env
          touch app/.env

          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using release keystore provided in GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
          else
            echo "No custom keystore secret provided. Creating temporary signing keystore for Release build..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=ILIA Notes, OU=Mobile, O=ILIA, L=Tehran, C=IR"
          fi

          # Also copy keystore into app folder for subproject safety
          cp "$KEYSTORE_FILE" "${{ github.workspace }}/app/my-upload-key.jks"

          # Export absolute path and password credentials to GITHUB_ENV
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV

          STORE_PWD="${{ secrets.STORE_PASSWORD }}"
          if [ -z "$STORE_PWD" ]; then STORE_PWD="android"; fi
          echo "STORE_PASSWORD=$STORE_PWD" >> $GITHUB_ENV

          KEY_PWD="${{ secrets.KEY_PASSWORD }}"
          if [ -z "$KEY_PWD" ]; then KEY_PWD="android"; fi
          echo "KEY_PASSWORD=$KEY_PWD" >> $GITHUB_ENV

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ILIA-Notes-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
